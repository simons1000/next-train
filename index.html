<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Next Train // Worcester Park</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

    :root {
      --amber: #ffb300;
      --dim:   #996800;
      --dark:  #0d0a00;
      --panel: #120e00;
      --red:   #ff3b3b;
      --green: #00e050;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--dark);
      color: var(--amber);
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 1.5rem 1rem 2rem;
    }

    /* CRT scanlines */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 3px,
        rgba(0,0,0,0.18) 3px, rgba(0,0,0,0.18) 4px
      );
      pointer-events: none; z-index: 999;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.7) 100%);
      pointer-events: none; z-index: 998;
    }

    .board {
      width: min(860px, 98vw);
      border: 1px solid var(--dim);
      background: var(--panel);
      box-shadow: 0 0 30px rgba(255,179,0,0.1);
    }

    /* Header */
    .header {
      background: var(--dim);
      padding: 0.35rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      color: var(--dark);
      letter-spacing: 0.06em;
    }
    .header .title { font-size: 0.85rem; font-weight: bold; }

    /* Station banner */
    .station-banner {
      padding: 0.8rem 1rem 0.6rem;
      border-bottom: 1px solid #2a2000;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .station-name {
      font-size: 1.6rem;
      letter-spacing: 0.08em;
      text-shadow: 0 0 16px rgba(255,179,0,0.5);
    }
    .station-meta {
      font-size: 0.7rem;
      color: var(--dim);
    }
    .station-meta span { color: var(--amber); }

    /* Poll timer */
    .poll-bar {
      padding: 0.35rem 1rem;
      font-size: 0.68rem;
      color: var(--dim);
      border-bottom: 1px solid #1a1400;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .poll-bar .track {
      flex: 1;
      height: 3px;
      background: #1a1400;
      position: relative;
    }
    .poll-bar .fill {
      height: 100%;
      background: var(--dim);
      transition: width 1s linear;
      box-shadow: 0 0 4px var(--dim);
    }
    .poll-bar .fill.active { background: var(--amber); box-shadow: 0 0 6px var(--amber); }

    /* Departures table */
    .dep-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }
    .dep-table thead tr {
      background: #1a1400;
      font-size: 0.65rem;
      color: var(--dim);
      letter-spacing: 0.08em;
    }
    .dep-table th, .dep-table td {
      padding: 0.55rem 0.9rem;
      text-align: left;
      border-bottom: 1px solid #1a1400;
    }
    .dep-table th { font-weight: normal; }
    .dep-table tbody tr:hover { background: rgba(255,179,0,0.04); }

    /* Status badges */
    .on-time   { color: var(--green); }
    .delayed   { color: #ff8800; }
    .cancelled { color: var(--red); text-decoration: line-through; }
    .unknown   { color: var(--dim); }

    .platform {
      display: inline-block;
      border: 1px solid var(--dim);
      padding: 0 0.35rem;
      font-size: 0.75rem;
      min-width: 2rem;
      text-align: center;
    }

    /* Next train highlight */
    .dep-table tbody tr.next {
      background: rgba(255,179,0,0.07);
    }
    .dep-table tbody tr.next td { color: var(--amber); }

    /* Countdown badge */
    .countdown {
      font-size: 1.1rem;
      letter-spacing: 0.04em;
      color: var(--amber);
      text-shadow: 0 0 12px rgba(255,179,0,0.6);
    }
    .countdown.soon { color: var(--red); text-shadow: 0 0 12px rgba(255,59,59,0.7); }
    .countdown.gone { color: var(--dim); text-shadow: none; font-size: 0.8rem; }

    /* Empty / error states */
    .state-msg {
      padding: 2.5rem 1rem;
      text-align: center;
      color: var(--dim);
      font-size: 0.85rem;
      letter-spacing: 0.06em;
    }
    .state-msg .big { font-size: 1.2rem; color: var(--amber); margin-bottom: 0.5rem; }
    .state-msg a { color: var(--amber); }

    .footer {
      padding: 0.4rem 1rem;
      font-size: 0.6rem;
      color: #3a2e00;
      display: flex;
      justify-content: space-between;
      border-top: 1px solid #1a1400;
      letter-spacing: 0.05em;
    }

    .blink { animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>

<div class="board">
  <div class="header">
    <span class="title">LIVE DEPARTURE BOARD</span>
    <span id="hdr-clock">--:--:--</span>
  </div>

  <div class="station-banner">
    <div>
      <div class="station-name">WORCESTER PARK</div>
      <div class="station-meta">CRS <span>WCP</span> &nbsp;·&nbsp; South Western Railway</div>
    </div>
    <div class="station-meta" id="last-updated">Last updated: —</div>
  </div>

  <div class="poll-bar">
    <span id="poll-label">Next refresh in <span id="poll-countdown">5:00</span></span>
    <div class="track"><div class="fill" id="poll-fill" style="width:100%"></div></div>
    <span id="poll-status">IDLE</span>
  </div>

  <div id="board-body">
    <div class="state-msg">
      <div class="big">AWAITING DATA<span class="blink">_</span></div>
      Loading departure board...
    </div>
  </div>

  <div class="footer">
    <span>DATA: NATIONAL RAIL DARWIN / HUXLEY2</span>
    <span>POLL INTERVAL: 5 MIN</span>
  </div>
</div>

<script>
  const POLL_MS   = 5 * 60 * 1000;   // 5 minutes
  const SOON_MINS = 3;                // highlight countdown red if ≤ this many minutes

  // ── Clock ─────────────────────────────────────────────────────────────────
  function pad(n) { return String(n).padStart(2, '0'); }
  function updateClock() {
    const n = new Date();
    document.getElementById('hdr-clock').textContent =
      `${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;
  }
  setInterval(updateClock, 1000);
  updateClock();

  // ── Countdown to next service ──────────────────────────────────────────────
  function minutesUntil(timeStr) {
    // timeStr is "HH:MM" in 24-hour format
    if (!timeStr) return null;
    const now   = new Date();
    const [h, m] = timeStr.split(':').map(Number);
    let svc = new Date(now);
    svc.setHours(h, m, 0, 0);
    // If the time is in the past, assume it's tomorrow
    if (svc < now) svc.setDate(svc.getDate() + 1);
    return Math.round((svc - now) / 60000);
  }

  function fmtCountdown(mins) {
    if (mins === null) return '—';
    if (mins <= 0)     return 'NOW';
    if (mins === 1)    return '1 MIN';
    return `${mins} MINS`;
  }

  // ── Poll bar ───────────────────────────────────────────────────────────────
  let pollTimer = null;
  let nextPollAt = null;

  function updatePollBar() {
    if (!nextPollAt) return;
    const remaining = Math.max(0, nextPollAt - Date.now());
    const pct = (remaining / POLL_MS) * 100;
    const secs = Math.ceil(remaining / 1000);
    const mm = Math.floor(secs / 60), ss = secs % 60;
    document.getElementById('poll-countdown').textContent = `${mm}:${pad(ss)}`;
    const fill = document.getElementById('poll-fill');
    fill.style.width = pct + '%';
    fill.className = 'fill' + (pct > 10 ? ' active' : '');
  }
  setInterval(updatePollBar, 1000);

  // ── Render ─────────────────────────────────────────────────────────────────
  function renderBoard(data) {
    const body = document.getElementById('board-body');
    const services = data.trainServices || [];

    if (!services.length) {
      body.innerHTML = `<div class="state-msg">
        <div class="big">NO SERVICES</div>
        No departures currently listed for WCP.
      </div>`;
      return;
    }

    const rows = services.map((svc, idx) => {
      const dest    = svc.destination?.[0]?.locationName ?? '—';
      const std     = svc.std ?? '—';
      const etd     = svc.etd ?? '—';
      const plat    = svc.platform ?? '—';
      const op      = svc.operator ?? '—';
      const mins    = minutesUntil(std);
      const isNext  = idx === 0;

      let statusClass = 'unknown', statusText = etd;
      if (etd === 'On time')    { statusClass = 'on-time';   statusText = 'ON TIME'; }
      else if (etd === 'Cancelled') { statusClass = 'cancelled'; statusText = 'CANCELLED'; }
      else if (etd && etd !== '—')  { statusClass = 'delayed';   statusText = `EXP ${etd}`; }

      const cdClass = mins === null ? 'gone'
                    : mins <= SOON_MINS ? 'soon' : '';

      return `<tr class="${isNext ? 'next' : ''}">
        <td><span class="countdown ${cdClass}">${fmtCountdown(mins)}</span></td>
        <td>${std}</td>
        <td>${dest}</td>
        <td><span class="${statusClass}">${statusText}</span></td>
        <td><span class="platform">${plat}</span></td>
        <td style="color:var(--dim);font-size:0.72rem">${op}</td>
      </tr>`;
    }).join('');

    body.innerHTML = `
      <table class="dep-table">
        <thead>
          <tr>
            <th>IN</th>
            <th>DEPARTS</th>
            <th>DESTINATION</th>
            <th>STATUS</th>
            <th>PLATFORM</th>
            <th>OPERATOR</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>`;

    const now = new Date();
    document.getElementById('last-updated').textContent =
      `Last updated: ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  }

  function renderError(err) {
    const body = document.getElementById('board-body');
    if (err.error === 'no_key') {
      body.innerHTML = `<div class="state-msg">
        <div class="big">API KEY REQUIRED</div>
        Register free at
        <a href="https://realtime.nationalrail.co.uk/OpenLDBWSRegistration/" target="_blank">
          realtime.nationalrail.co.uk/OpenLDBWSRegistration
        </a>
        then add your key to <code>config.json</code>.
      </div>`;
    } else {
      body.innerHTML = `<div class="state-msg">
        <div class="big">ERROR</div>
        ${err.message ?? 'Could not reach departure board API.'}
      </div>`;
    }
  }

  // ── Fetch ──────────────────────────────────────────────────────────────────
  async function fetchDepartures() {
    document.getElementById('poll-status').textContent = 'FETCHING';
    try {
      const res  = await fetch('/api/departures');
      const data = await res.json();
      if (!res.ok || data.error) {
        renderError(data);
      } else {
        renderBoard(data);
      }
      document.getElementById('poll-status').textContent = res.ok ? 'OK' : 'ERR';
    } catch (e) {
      renderError({ message: e.message });
      document.getElementById('poll-status').textContent = 'ERR';
    }
    nextPollAt = Date.now() + POLL_MS;
    updatePollBar();
  }

  // ── Kick off ───────────────────────────────────────────────────────────────
  fetchDepartures();
  setInterval(fetchDepartures, POLL_MS);

  // Update the countdown table column every 30 seconds
  setInterval(() => {
    document.querySelectorAll('.dep-table tbody tr').forEach((row, idx) => {
      const stdCell = row.cells[1]?.textContent;
      if (!stdCell) return;
      const mins = minutesUntil(stdCell);
      const cd   = row.cells[0]?.querySelector('.countdown');
      if (!cd) return;
      cd.textContent = fmtCountdown(mins);
      cd.className   = 'countdown ' + (mins === null ? 'gone' : mins <= SOON_MINS ? 'soon' : '');
    });
  }, 30000);
</script>

</body>
</html>
