<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Next Train // Worcester Park</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

    :root {
      --pink:   #ff2d78;
      --cyan:   #00f0ff;
      --purple: #bf5fff;
      --dark:   #080010;
      --panel:  #0e0020;
      --text:   #ffe8ff;
      --dim:    #5a3a7a;
      --green:  #00ff99;
      --red:    #ff3b6b;
      --amber:  #ffcc44;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--dark);
      color: var(--text);
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 1.5rem 1rem 2rem;
      overflow-x: hidden;
    }

    #rain   { position: fixed; inset: 0; opacity: 0.07; z-index: 0; }
    #sakura { position: fixed; inset: 0; pointer-events: none; z-index: 1; }

    /* CRT scanlines */
    body::after {
      content: ''; position: fixed; inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 3px,
        rgba(0,0,0,0.12) 3px, rgba(0,0,0,0.12) 4px
      );
      pointer-events: none; z-index: 998;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.85) 100%);
      pointer-events: none; z-index: 997;
    }

    /* Board container */
    .board {
      position: relative; z-index: 2;
      width: min(900px, 98vw);
      border: 1px solid var(--purple);
      background: rgba(14,0,32,0.93);
      box-shadow:
        0 0 0 1px rgba(191,95,255,0.15),
        0 0 50px rgba(191,95,255,0.12),
        0 0 100px rgba(255,45,120,0.06);
    }

    /* Decorative corner diamonds */
    .board::before {
      content: '◈'; position: absolute; top: -0.85rem; left: 0.6rem;
      color: var(--pink); font-size: 1.6rem; text-shadow: 0 0 12px var(--pink);
    }
    .board::after {
      content: '◈'; position: absolute; top: -0.85rem; right: 0.6rem;
      color: var(--cyan); font-size: 1.6rem; text-shadow: 0 0 12px var(--cyan);
    }

    /* Header bar */
    .header {
      background: linear-gradient(90deg,
        rgba(255,45,120,0.12), rgba(191,95,255,0.14), rgba(0,240,255,0.1));
      border-bottom: 1px solid rgba(191,95,255,0.4);
      padding: 0.32rem 1rem;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.7rem; letter-spacing: 0.08em;
    }
    .header .title { color: var(--pink); text-shadow: 0 0 10px var(--pink); }
    .header .right { color: var(--cyan); text-shadow: 0 0 8px var(--cyan); }

    /* Station banner */
    .station-banner {
      padding: 1rem 1.2rem 0.85rem;
      border-bottom: 1px solid rgba(191,95,255,0.25);
      display: flex; justify-content: space-between; align-items: flex-end;
      flex-wrap: wrap; gap: 0.5rem;
      background: linear-gradient(180deg, rgba(255,45,120,0.06) 0%, transparent 100%);
    }
    .station-en {
      font-size: 1.75rem; letter-spacing: 0.1em; color: var(--text);
      text-shadow: 0 0 24px rgba(255,45,120,0.55), 0 0 50px rgba(255,45,120,0.25);
    }
    .station-jp {
      font-family: sans-serif;
      font-size: 0.9rem; color: var(--pink); letter-spacing: 0.12em;
      text-shadow: 0 0 10px var(--pink); margin-top: 0.25rem;
    }
    .station-meta { font-size: 0.68rem; color: var(--dim); text-align: right; line-height: 1.7; }
    .station-meta span { color: var(--purple); }

    /* NRCC alert ticker */
    .nrcc-banner {
      display: none;
      border-bottom: 1px solid rgba(255,204,68,0.28);
      background: rgba(255,204,68,0.04);
      padding: 0.3rem 0;
      align-items: center;
    }
    .nrcc-banner.visible { display: flex; }
    .nrcc-label {
      flex-shrink: 0;
      padding: 0 1rem;
      font-size: 0.64rem;
      letter-spacing: 0.1em;
      color: var(--amber);
      text-shadow: 0 0 8px var(--amber);
      border-right: 1px solid rgba(255,204,68,0.2);
    }
    .nrcc-track { flex: 1; overflow: hidden; }
    .nrcc-scroll {
      display: inline-block;
      white-space: nowrap;
      color: var(--amber);
      font-size: 0.68rem;
      letter-spacing: 0.05em;
      text-shadow: 0 0 6px rgba(255,204,68,0.3);
      animation: nrcc-scroll 30s linear infinite;
    }
    @keyframes nrcc-scroll {
      from { transform: translateX(100vw); }
      to   { transform: translateX(-100%); }
    }

    /* Poll bar */
    .poll-bar {
      padding: 0.38rem 1.2rem; font-size: 0.66rem; color: var(--dim);
      border-bottom: 1px solid rgba(191,95,255,0.12);
      display: flex; align-items: center; gap: 0.8rem;
    }
    .poll-bar .label { color: var(--purple); letter-spacing: 0.06em; }
    .poll-bar .cd    { color: var(--text); min-width: 3.2rem; }
    .poll-bar .track { flex: 1; height: 2px; background: rgba(191,95,255,0.08); }
    .poll-bar .fill  { height: 100%; background: var(--dim); transition: width 1s linear; }
    .poll-bar .fill.active { background: var(--purple); box-shadow: 0 0 6px var(--purple); }

    /* Table */
    .dep-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    .dep-table thead th {
      padding: 0.5rem 0.9rem; font-weight: normal;
      color: var(--purple); font-size: 0.64rem; letter-spacing: 0.1em;
      border-bottom: 1px solid rgba(191,95,255,0.3);
      text-align: left;
    }
    .dep-table thead .jp {
      font-family: sans-serif;
      font-size: 0.58rem; color: var(--dim); display: block; margin-top: 1px;
    }
    .dep-table td { padding: 0.6rem 0.9rem; border-bottom: 1px solid rgba(191,95,255,0.08); }
    .dep-table tbody tr:hover { background: rgba(191,95,255,0.05); }
    .dep-table tbody tr.next td {
      position: relative;
      background: linear-gradient(90deg,
        rgba(255,45,120,0.32) 0%,
        rgba(191,95,255,0.18) 50%,
        rgba(0,240,255,0.12) 100%);
      background-size: 250% 100%;
      animation: next-shimmer 2s ease-in-out infinite;
      border-top: 1px solid rgba(255,45,120,0.85);
      border-bottom: 1px solid rgba(255,45,120,0.55);
      box-shadow: 0 -3px 20px rgba(255,45,120,0.45), 0 3px 20px rgba(255,45,120,0.3);
      text-shadow: 0 0 16px rgba(255,45,120,0.85), 0 0 32px rgba(255,45,120,0.4);
    }
    @keyframes next-shimmer {
      0%, 100% { background-position: 0% 0%; }
      50%       { background-position: 100% 0%; }
    }
    .dep-table tbody tr.next td:first-child {
      border-left: 5px solid var(--pink);
      box-shadow:
        inset 24px 0 60px rgba(255,45,120,0.45),
        0 -3px 20px rgba(255,45,120,0.45),
        0 3px 20px rgba(255,45,120,0.3);
    }
    .dep-table tbody tr.next td:first-child::before {
      content: '▶▶';
      color: var(--pink);
      font-size: 0.62rem;
      letter-spacing: -0.05em;
      margin-right: 0.5rem;
      vertical-align: middle;
      text-shadow: 0 0 6px var(--pink), 0 0 18px var(--pink), 0 0 36px var(--pink);
      animation: next-arrow 0.9s ease-in-out infinite;
      display: inline-block;
    }
    .dep-table tbody tr.next td:first-child::after {
      content: '次の列車';
      display: block;
      font-family: sans-serif;
      font-size: 0.42rem;
      letter-spacing: 0.2em;
      color: rgba(255,45,120,0.65);
      text-shadow: 0 0 8px var(--pink);
      margin-top: 3px;
      animation: blink 2s step-end infinite;
    }
    @keyframes next-arrow {
      0%, 100% { transform: translateX(0);   opacity: 1; }
      50%       { transform: translateX(5px); opacity: 0.4; }
    }
    .dep-table tbody tr.next .countdown {
      font-size: 1.5rem;
      color: var(--pink);
      letter-spacing: 0.08em;
      animation: next-cd-glow 1.6s ease-in-out infinite;
    }
    @keyframes next-cd-glow {
      0%, 100% {
        text-shadow:
          0 0 10px var(--pink),
          0 0 28px var(--pink),
          0 0 55px rgba(255,45,120,0.6);
      }
      50% {
        text-shadow:
          0 0 18px var(--pink),
          0 0 48px var(--pink),
          0 0 90px rgba(255,45,120,0.8),
          0 0 150px rgba(255,45,120,0.35);
      }
    }

    .on-time   { color: var(--green); text-shadow: 0 0 8px var(--green); }
    .delayed   { color: var(--amber); text-shadow: 0 0 8px var(--amber); }
    .cancelled { color: var(--red);   text-decoration: line-through; }
    .unknown   { color: var(--dim); }

    .status-jp {
      font-family: sans-serif;
      font-size: 0.62rem; display: block; margin-top: 2px; opacity: 0.75;
    }

    .platform {
      display: inline-block; border: 1px solid var(--purple);
      padding: 0 0.4rem; min-width: 2.2rem; text-align: center;
      font-size: 0.76rem; color: var(--purple);
      box-shadow: 0 0 6px rgba(191,95,255,0.2);
    }

    .countdown { font-size: 1.05rem; letter-spacing: 0.04em; color: var(--text); }
    .countdown.soon {
      color: var(--pink); text-shadow: 0 0 14px var(--pink);
      animation: pulse 0.8s ease-in-out infinite;
    }
    .countdown.gone { color: var(--dim); font-size: 0.78rem; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.45} }

    /* Glitch */
    .glitch { position: relative; display: inline-block; }
    .glitch.g::before, .glitch.g::after {
      content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    }
    .glitch.g::before { color: var(--pink); animation: g1 0.18s steps(2) forwards; }
    .glitch.g::after  { color: var(--cyan); animation: g2 0.18s steps(2) forwards; }
    @keyframes g1 { 0%{clip-path:inset(30% 0 50% 0);transform:translateX(-4px)} 50%{clip-path:inset(60% 0 10% 0);transform:translateX(3px)} 100%{clip-path:inset(0 0 100% 0)} }
    @keyframes g2 { 0%{clip-path:inset(50% 0 20% 0);transform:translateX(4px)} 50%{clip-path:inset(10% 0 65% 0);transform:translateX(-3px)} 100%{clip-path:inset(0 0 100% 0)} }

    /* State messages */
    .state-msg { padding: 2.5rem 1rem; text-align: center; font-size: 0.85rem; letter-spacing: 0.06em; color: var(--dim); }
    .state-msg .big { font-size: 1.2rem; color: var(--pink); text-shadow: 0 0 14px var(--pink); margin-bottom: 0.5rem; }
    .state-msg a { color: var(--cyan); }
    .state-msg code { color: var(--purple); }

    .footer {
      padding: 0.4rem 1.2rem; font-size: 0.6rem; color: var(--dim);
      border-top: 1px solid rgba(191,95,255,0.12);
      display: flex; justify-content: space-between; letter-spacing: 0.05em;
    }
    .footer .jp { font-family: sans-serif; color: rgba(255,45,120,0.5); }

    .blink { animation: blink 1s step-end infinite; }
    @keyframes blink { 50%{opacity:0} }

    @media (max-width: 600px) {
      body {
        padding-top:    max(0.75rem, env(safe-area-inset-top));
        padding-bottom: max(1rem,    env(safe-area-inset-bottom));
        padding-left:   0;
        padding-right:  0;
      }

      /* Full-width, no overflowing decorations */
      .board { width: 100%; }
      .board::before, .board::after { content: none; }

      .header { font-size: 0.6rem; padding: 0.28rem 0.75rem; }

      /* Compact the station banner — drop the JP subtitle that wraps */
      .station-banner { padding: 0.55rem 0.75rem; }
      .station-en  { font-size: 1.15rem; }
      .station-jp  { display: none; }
      .station-meta { font-size: 0.57rem; text-align: left; }

      .poll-bar { padding: 0.25rem 0.75rem; font-size: 0.6rem; }

      /* Hide JP sub-labels inside table rows */
      .status-jp { display: none; }

      /* Fixed 4-column layout: IN | DEPARTS | DESTINATION | STATUS */
      .dep-table { font-size: 0.76rem; table-layout: fixed; width: 100%; }
      .dep-table thead th { padding: 0.3rem 0.45rem; font-size: 0.58rem; }
      .dep-table td       { padding: 0.5rem 0.45rem;  overflow: hidden; }

      .dep-table th:nth-child(1), .dep-table td:nth-child(1) { width: 22%; white-space: nowrap; }
      .dep-table th:nth-child(2), .dep-table td:nth-child(2) { width: 16%; }
      .dep-table th:nth-child(3), .dep-table td:nth-child(3) { width: 38%; white-space: nowrap; text-overflow: ellipsis; }
      .dep-table th:nth-child(4), .dep-table td:nth-child(4) { width: 24%; }

      /* Hide platform + operator */
      .dep-table th:nth-child(n+5),
      .dep-table td:nth-child(n+5) { display: none; }

      /* Next-train row: keep the glow, drop the arrows and kanji that bloat the cell */
      .dep-table tbody tr.next .countdown { font-size: 0.9rem; }
      .dep-table tbody tr.next td:first-child::before,
      .dep-table tbody tr.next td:first-child::after { content: none; }
    }
  </style>
</head>
<body>

<canvas id="rain"></canvas>
<canvas id="sakura"></canvas>

<div class="board">

  <div class="header">
    <span class="title">▸ LIVE DEPARTURE BOARD</span>
    <span class="right" id="hdr-clock">--:--:--</span>
  </div>

  <div class="station-banner">
    <div>
      <div class="station-en glitch" data-text="WORCESTER PARK">WORCESTER PARK</div>
      <div class="station-jp">WORCESTER PARK &nbsp;✦&nbsp; DEPARTURES</div>
    </div>
    <div class="station-meta">
      CRS <span>WCP</span> &nbsp;·&nbsp; South Western Railway<br>
      <span id="last-updated">—</span>
    </div>
  </div>

  <div id="nrcc-banner" class="nrcc-banner">
    <span class="nrcc-label">⚡ ALERT</span>
    <div class="nrcc-track"><span id="nrcc-scroll" class="nrcc-scroll"></span></div>
  </div>

  <div class="poll-bar">
    <span class="label">NEXT UPDATE</span>
    <span class="cd" id="poll-countdown">5:00</span>
    <div class="track"><div class="fill" id="poll-fill" style="width:100%"></div></div>
    <span id="poll-status">IDLE</span>
  </div>

  <div id="board-body">
    <div class="state-msg">
      <div class="big">LOADING<span class="blink">_</span></div>
      Loading departure board...
    </div>
  </div>

  <div class="footer">
    <span>NATIONAL RAIL DARWIN / HUXLEY &nbsp;·&nbsp; 5 MIN POLL</span>
    <span class="jp">Train departure board ✦ Worcester Park</span>
  </div>

</div>

<script>
  const POLL_MS   = 5 * 60 * 1000;
  const SOON_MINS = 3;

  // ── Katakana rain ──────────────────────────────────────────────────────────
  (function(){
    const c = document.getElementById('rain');
    const x = c.getContext('2d');
    const K = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    let cols, drops;
    function init(){ c.width=innerWidth; c.height=innerHeight; cols=Math.floor(c.width/18); drops=Array(cols).fill(1); }
    function draw(){
      x.fillStyle='rgba(8,0,16,0.06)'; x.fillRect(0,0,c.width,c.height);
      x.font='14px monospace';
      drops.forEach((y,i)=>{
        x.fillStyle = i%3===0?'#ff2d78':i%3===1?'#bf5fff':'#00f0ff';
        x.fillText(K[Math.floor(Math.random()*K.length)],i*18,y*18);
        if(y*18>c.height&&Math.random()>.975) drops[i]=0;
        drops[i]++;
      });
    }
    init(); addEventListener('resize',init); setInterval(draw,60);
  })();

  // ── Sakura petals ──────────────────────────────────────────────────────────
  (function(){
    const c = document.getElementById('sakura');
    const x = c.getContext('2d');
    let petals = [];
    const COLORS = ['#ff8fb3','#ffb3cc','#ffc0d4','#ff7aaa','#ffaac5'];

    function init(){
      c.width=innerWidth; c.height=innerHeight; petals=[];
      for(let i=0;i<45;i++) petals.push({
        x: Math.random()*c.width,
        y: Math.random()*c.height,
        r: 2.5+Math.random()*3.5,
        vx:(Math.random()-.4)*.7,
        vy:.35+Math.random()*.9,
        rot:Math.random()*Math.PI*2,
        vrot:(Math.random()-.5)*.04,
        alpha:.25+Math.random()*.45,
        col:COLORS[Math.floor(Math.random()*COLORS.length)],
      });
    }
    function draw(){
      x.clearRect(0,0,c.width,c.height);
      petals.forEach(p=>{
        x.save();
        x.translate(p.x,p.y); x.rotate(p.rot); x.scale(1,.55);
        x.globalAlpha=p.alpha;
        x.beginPath(); x.arc(0,0,p.r,0,Math.PI*2);
        x.fillStyle=p.col; x.fill();
        x.restore();
        p.x+=p.vx; p.y+=p.vy; p.rot+=p.vrot;
        if(p.y>c.height+10){p.y=-10;p.x=Math.random()*c.width;}
      });
    }
    init(); addEventListener('resize',init); setInterval(draw,33);
  })();

  // ── Glitch ─────────────────────────────────────────────────────────────────
  const glitchEl = document.querySelector('.glitch');
  setInterval(()=>{ if(Math.random()<.15){ glitchEl.classList.add('g'); setTimeout(()=>glitchEl.classList.remove('g'),200); } },4000);

  // ── Clock ──────────────────────────────────────────────────────────────────
  const pad = n => String(n).padStart(2,'0');
  function tick_clock(){
    const n=new Date();
    document.getElementById('hdr-clock').textContent=`${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;
  }
  setInterval(tick_clock,1000); tick_clock();

  // ── Poll bar ───────────────────────────────────────────────────────────────
  let nextPollAt=null;
  function updatePollBar(){
    if(!nextPollAt)return;
    const rem=Math.max(0,nextPollAt-Date.now());
    const s=Math.ceil(rem/1000);
    document.getElementById('poll-countdown').textContent=`${Math.floor(s/60)}:${pad(s%60)}`;
    const f=document.getElementById('poll-fill');
    f.style.width=(rem/POLL_MS*100)+'%';
    f.className='fill'+(rem/POLL_MS>0.1?' active':'');
  }
  setInterval(updatePollBar,1000);

  // ── Helpers ────────────────────────────────────────────────────────────────
  function minutesUntil(t){
    if(!t||t==='—')return null;
    const now=new Date(),[h,m]=t.split(':').map(Number);
    let d=new Date(now); d.setHours(h,m,0,0);
    if(d<now)d.setDate(d.getDate()+1);
    return Math.round((d-now)/60000);
  }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function fmtCd(mins){
    if(mins===null)return'—'; if(mins<=0)return'NOW'; if(mins===1)return'1 MIN'; return`${mins} MINS`;
  }
  function parseStatus(etd){
    if(!etd||etd==='—')   return{cls:'unknown',  en:'—',            jp:'UNKNOWN'};
    if(etd==='On time')   return{cls:'on-time',   en:'ON TIME',      jp:'ON TIME'};
    if(etd==='Cancelled') return{cls:'cancelled', en:'CANCELLED',    jp:'CANCELLED'};
    return                      {cls:'delayed',   en:`EXP ${etd}`,   jp:`EXP ${etd}`};
  }

  // ── NRCC messages ──────────────────────────────────────────────────────────
  function stripHtml(html){
    return html.replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();
  }
  let _nrccText='';
  function renderNrcc(messages){
    const banner=document.getElementById('nrcc-banner');
    if(!messages||!messages.length){ banner.classList.remove('visible'); _nrccText=''; return; }
    const text=messages
      .map(m=>typeof m==='string'?m:m.value||'')
      .map(stripHtml).filter(Boolean).join('  ✦  ');
    if(!text){ banner.classList.remove('visible'); _nrccText=''; return; }
    if(text===_nrccText) return;
    _nrccText=text;
    const el=document.getElementById('nrcc-scroll');
    el.textContent=text;
    el.style.animation='none';
    void el.offsetWidth;
    el.style.animation='';
    el.style.animationDuration=Math.max(15,text.length/12)+'s';
    banner.classList.add('visible');
  }

  // ── Render ─────────────────────────────────────────────────────────────────
  function renderBoard(data){
    renderNrcc(data.nrccMessages);
    const body=document.getElementById('board-body');
    const svcs=data.trainServices||[];
    if(!svcs.length){
      body.innerHTML=`<div class="state-msg"><div class="big">NO SERVICES</div>No services currently listed for WCP.</div>`;
      return;
    }
    const nextIdx=svcs.findIndex(s=>(s.etd??'')!=='Cancelled');
    const rows=svcs.map((s,i)=>{
      const dest=s.destination?.[0]?.locationName??'—';
      const std=s.std??'—', etd=s.etd??'—', plat=s.platform??'—', op=s.operator??'—';
      const eff=etd==='Cancelled'?'—':(etd&&etd!=='—'&&etd!=='On time')?etd:std;
      const mins=minutesUntil(eff), st=parseStatus(etd);
      const cdCls=mins===null?'gone':mins<=SOON_MINS?'soon':'';
      return`<tr class="${i===nextIdx?'next':''}" data-eff="${eff}">
        <td><span class="countdown ${cdCls}">${fmtCd(mins)}</span></td>
        <td><span class="${st.cls}">${std}</span></td>
        <td>${esc(dest)}</td>
        <td><span class="${st.cls}">${st.en}</span><span class="status-jp ${st.cls}">${st.jp}</span></td>
        <td><span class="platform">${esc(plat)}</span></td>
        <td style="color:var(--dim);font-size:.7rem">${esc(op)}</td>
      </tr>`;
    }).join('');

    body.innerHTML=`<table class="dep-table">
      <thead><tr>
        <th>IN</th>
        <th>DEPARTS</th>
        <th>DESTINATION</th>
        <th>STATUS</th>
        <th>PLATFORM</th>
        <th>OPERATOR</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;

    const n=new Date();
    document.getElementById('last-updated').textContent=`Updated: ${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;
  }

  function renderError(err){
    renderNrcc(null);
    const body=document.getElementById('board-body');
    body.innerHTML=`<div class="state-msg"><div class="big">ERROR ✖</div>${esc(err.message??'Could not reach API.')}</div>`;
  }

  // ── Fetch ──────────────────────────────────────────────────────────────────
  async function fetchDepartures(){
    document.getElementById('poll-status').textContent='FETCHING';
    try{
      const res=await fetch('/api/departures');
      const data=await res.json();
      if(!res.ok||data.error) renderError(data);
      else renderBoard(data);
      document.getElementById('poll-status').textContent=res.ok&&!data.error?'OK':'ERR';
    }catch(e){
      renderError({message:e.message});
      document.getElementById('poll-status').textContent='ERR';
    }
    nextPollAt=Date.now()+POLL_MS;
    updatePollBar();
  }

  fetchDepartures();
  setInterval(fetchDepartures,POLL_MS);

  setInterval(()=>{
    document.querySelectorAll('.dep-table tbody tr').forEach(row=>{
      const eff=row.dataset.eff||row.cells[1]?.textContent;
      const cd=row.cells[0]?.querySelector('.countdown');
      if(!cd||!eff)return;
      const mins=minutesUntil(eff);
      cd.textContent=fmtCd(mins);
      cd.className='countdown '+(mins===null?'gone':mins<=SOON_MINS?'soon':'');
    });
  },30000);
</script>
</body>
</html>
